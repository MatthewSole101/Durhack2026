<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Draw – Hand Landmarker AR</title>
<style>
  :root { --accent:#4fd1c5; --text:#f2f4f8; --muted:#a9b1c4; --glass:rgba(15,17,21,.62); }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:#000; color:var(--text); overflow:hidden;
    font:14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  video { position:fixed; left:0; top:0; width:2px; height:2px; opacity:0; pointer-events:none; }

  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    background:radial-gradient(ellipse at center, #1a1f2b 0%, #000 70%); text-align:center; padding:24px; }
  #start h2 { margin:0; font-size:26px; }
  #start ul { margin:0; padding:0; list-style:none; color:var(--muted); display:grid; gap:8px; max-width:440px; text-align:left; }
  #start li b { color:var(--text); }
  #startBtn { background:var(--accent); color:#06201d; border:0; border-radius:10px; padding:12px 22px;
    font:600 16px system-ui, sans-serif; cursor:pointer; }
  #startBtn:disabled { opacity:.5; cursor:default; }
  #status.err { color:#f6ad55; }

  /* brief gesture feedback ("Undo", "Cleared") */
  #toast { position:fixed; left:50%; top:28px; transform:translate(-50%, -8px); opacity:0; pointer-events:none;
    background:var(--glass); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(79,209,197,.5); color:var(--text); font-weight:600; letter-spacing:.02em;
    padding:8px 16px; border-radius:999px; transition:opacity .2s, transform .2s; }
  #toast.show { opacity:1; transform:translate(-50%, 0); }
  #err { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#7b2d26; color:#fff;
    padding:10px 14px; border-radius:10px; max-width:min(560px, calc(100vw - 40px)); font-size:13px; }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="toast"></div>
<div id="err" hidden></div>

<div id="start">
  <h2>Air Draw</h2>
  <ul>
    <li>☝️ <b>Draw:</b> point your index finger with your thumb and other fingers curled in. Open or relax the hand to lift the pen.</li>
    <li>🤏🤏 <b>Undo:</b> pinch thumb and index together twice quickly.</li>
    <li>👋 <b>Clear:</b> flick an open hand quickly across the screen.</li>
  </ul>
  <button id="startBtn" disabled>Loading model…</button>
  <div id="status"></div>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3/vision_bundle.mjs";

const WASM  = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3/wasm";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

// ---------------- tunables ----------------
const PEN_COLOR = "#4fd1c5";   // single fixed colour, matches the UI accent
const PEN_SIZE  = 8;

// finger extension score = dist(wrist, tip) / dist(wrist, PIP joint)
//   straight finger ≈ 1.3–1.5, curled finger ≈ 0.7–0.95
const EXT_ON = 1.15, EXT_OFF = 1.05;   // index counts as extended / stops counting
const CURL_MAX = 1.0, CURL_OFF = 1.1;  // other fingers count as curled / stop counting
// thumb tucked = thumb tip close to the base of the index/middle fingers (÷ palm size)
const THUMB_CLOSED = 0.55, THUMB_OPEN = 0.70;
const POSE_FRAMES = 3;                 // frames a pose must hold before pen goes down / up

const PINCH_ON = 0.30, PINCH_OFF = 0.45; // thumb–index distance / hand size
const TAP_MAX_MS = 450;                  // a pinch longer than this isn't a "tap"
const DOUBLE_GAP_MS = 550;               // max time between the two pinch taps

const FLICK_WINDOW_MS = 220;   // look this far back for the motion
const FLICK_DIST = 0.16;       // hand must travel this fraction of the frame width…
const FLICK_COOLDOWN_MS = 1200;

// ---------------- setup ----------------
const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("canvas"), ctx = canvas.getContext("2d");
const FINGERS = { index: [5, 6, 8], middle: [9, 10, 12], ring: [13, 14, 16], pinky: [17, 18, 20] }; // mcp, pip, tip

let landmarker, stream;
let W = 0, H = 0, dpr = 1;

const strokes = [];      // { pts:[[x,y] video px, un-mirrored], active }
const history = [];      // { type:"stroke", stroke } | { type:"clear", saved:[...] }
let slots = [];          // per tracked hand state
let lastInfo = null, lastVideoTime = -1, lastFlickT = -1e9;
let frames = 0, fpsT0 = performance.now(), fps = 0, inferMs = 0;

function setStatus(msg, err = false) { $("status").textContent = msg; $("status").className = err ? "err" : ""; }
function showError(msg) { $("err").textContent = msg; $("err").hidden = false; console.error(msg); }
let toastTimer;
function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 900);
}

addEventListener("keydown", e => { if (e.key === "c") clearAll(); if (e.key === "z") undo(); });

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize); resize();

// One Euro filter: smooths jitter without adding much lag
class OneEuro {
  constructor(minCutoff = 1.5, beta = 0.01, dCutoff = 1) { Object.assign(this, { minCutoff, beta, dCutoff }); this.reset(); }
  reset() { this.x = null; this.dx = 0; this.t = null; }
  alpha(cutoff, dt) { const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
  filter(x, t) {
    if (this.x === null) { this.x = x; this.t = t; return x; }
    const dt = Math.max((t - this.t) / 1000, 1e-3); this.t = t;
    const dx = (x - this.x) / dt;
    this.dx += this.alpha(this.dCutoff, dt) * (dx - this.dx);
    const cutoff = this.minCutoff + this.beta * Math.abs(this.dx);
    this.x += this.alpha(cutoff, dt) * (x - this.x);
    return this.x;
  }
}

// ---------------- geometry ----------------
// video is drawn mirrored with "cover" fit
function fit() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(W / vw, H / vh);
  const dw = vw * s, dh = vh * s;
  return { vw, vh, s, dw, dh, ox: (W - dw) / 2, oy: (H - dh) / 2 };
}
const toScreen = (f, x, y) => [f.ox + f.dw - x * f.s, f.oy + y * f.s];
const px = (f, p) => [p.x * f.vw, p.y * f.vh];
const p3 = (f, p) => [p.x * f.vw, p.y * f.vh, p.z * f.vw];  // z is on the same scale as x
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], (a[2] ?? 0) - (b[2] ?? 0));

// ---------------- model ----------------
async function build() {
  const fileset = await FilesetResolver.forVisionTasks(WASM);
  const opts = delegate => ({
    baseOptions: { modelAssetPath: MODEL, delegate },
    runningMode: "VIDEO", numHands: 2,
    minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5,
  });
  try { landmarker = await HandLandmarker.createFromOptions(fileset, opts("GPU")); }
  catch { landmarker = await HandLandmarker.createFromOptions(fileset, opts("CPU")); }
  $("startBtn").disabled = false; $("startBtn").textContent = "Start camera";
}

async function start() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, audio: false });
    video.srcObject = stream;
    await new Promise(r => video.readyState >= 1 ? r() : video.addEventListener("loadedmetadata", r, { once: true }));
    await video.play();
    $("start").hidden = true;
    requestAnimationFrame(loop);
  } catch (e) {
    setStatus("Camera unavailable: " + e.message + " — open this page via http://localhost or https.", true);
  }
}
$("startBtn").onclick = start;

// ---------------- drawing actions ----------------
function beginStroke() {
  const s = { pts: [], active: true };
  strokes.push(s); history.push({ type: "stroke", stroke: s });
  return s;
}
function endStroke(slot) {
  if (!slot.stroke) return;
  slot.stroke.active = false;
  if (!slot.stroke.pts.length) {                     // nothing was drawn: drop silently
    strokes.splice(strokes.indexOf(slot.stroke), 1);
    history.splice(history.findIndex(h => h.stroke === slot.stroke), 1);
  }
  slot.stroke = null; slot.fx.reset(); slot.fy.reset();
}
function undo() {
  // most recent finished action (skip strokes still being drawn)
  for (let i = history.length - 1; i >= 0; i--) {
    const h = history[i];
    if (h.type === "stroke" && h.stroke.active) continue;
    history.splice(i, 1);
    if (h.type === "stroke") { strokes.splice(strokes.indexOf(h.stroke), 1); toast("↩ Undo"); }
    else { strokes.push(...h.saved); toast("↩ Restored"); }
    return;
  }
  toast("Nothing to undo");
}
function clearAll() {
  slots.forEach(endStroke);
  if (!strokes.length) return;
  history.push({ type: "clear", saved: strokes.splice(0) });
  toast("✨ Cleared");
}

// ---------------- per-hand gesture analysis ----------------
function newSlot() {
  return { wrist: null, pointFrames: 0, relaxFrames: 0, pointing: false, stroke: null,
           fx: new OneEuro(), fy: new OneEuro(),
           pinched: false, pinchStart: 0, lastTapEnd: -1e9,
           idxExt: false, thumbIn: false, curled: { middle: false, ring: false, pinky: false },
           trail: [] };
}

// keep each hand's state attached to the same physical hand even if result order swaps
function trackHands(hands) {
  let prev = slots;
  if (hands.length === 2 && prev.length === 2) {
    const keep = dist(hands[0].wrist, prev[0].wrist) + dist(hands[1].wrist, prev[1].wrist);
    const swap = dist(hands[0].wrist, prev[1].wrist) + dist(hands[1].wrist, prev[0].wrist);
    if (swap < keep) prev = [prev[1], prev[0]];
  } else if (hands.length === 1 && prev.length === 2) {
    const i = dist(hands[0].wrist, prev[1].wrist) < dist(hands[0].wrist, prev[0].wrist) ? 1 : 0;
    endStroke(prev[1 - i]); prev = [prev[i]];
  } else if (hands.length === 2 && prev.length === 1) {
    prev = dist(hands[1].wrist, prev[0].wrist) < dist(hands[0].wrist, prev[0].wrist) ? [newSlot(), prev[0]] : [prev[0], newSlot()];
  } else if (hands.length === 0) {
    prev.forEach(endStroke);
  }
  slots = hands.map((h, i) => Object.assign(prev[i] ?? newSlot(), { wrist: h.wrist }));
}

const extScore = (f, lm, [, pip, tip]) => dist(p3(f, lm[0]), p3(f, lm[tip])) / (dist(p3(f, lm[0]), p3(f, lm[pip])) || 1);

function analyse(f, lm, s, t) {
  // finger states with hysteresis
  const sc = Object.fromEntries(Object.entries(FINGERS).map(([k, v]) => [k, extScore(f, lm, v)]));
  s.idxExt = s.idxExt ? sc.index > EXT_OFF : sc.index > EXT_ON;
  for (const k of ["middle", "ring", "pinky"]) s.curled[k] = s.curled[k] ? sc[k] < CURL_OFF : sc[k] < CURL_MAX;
  const openCount = ["index", "middle", "ring", "pinky"].filter(k => sc[k] > EXT_ON).length;
  const palm = dist(p3(f, lm[0]), p3(f, lm[9])) || 1;

  // thumb: tucked if its tip sits near the index/middle knuckles or middle-finger PIP
  const thumbTip = p3(f, lm[4]);
  const thumbR = Math.min(...[5, 6, 9, 10].map(i => dist(thumbTip, p3(f, lm[i])))) / palm;
  s.thumbIn = s.thumbIn ? thumbR < THUMB_OPEN : thumbR < THUMB_CLOSED;

  // pinch (thumb tip ↔ index tip, relative to palm size)
  const pinchR = dist(p3(f, lm[4]), p3(f, lm[8])) / palm;
  const wasPinched = s.pinched;
  s.pinched = s.pinched ? pinchR < PINCH_OFF : pinchR < PINCH_ON;

  // ☝️ pointing pose → pen down after POSE_FRAMES, pen up after POSE_FRAMES without it
  const pose = s.idxExt && s.thumbIn && s.curled.middle && s.curled.ring && s.curled.pinky && !s.pinched;
  if (pose) { s.pointFrames++; s.relaxFrames = 0; } else { s.relaxFrames++; s.pointFrames = 0; }
  if (!s.pointing && s.pointFrames >= POSE_FRAMES) s.pointing = true;
  if (s.pointing && s.relaxFrames >= POSE_FRAMES) { s.pointing = false; endStroke(s); }

  const tip = px(f, lm[8]);
  s.tip = [s.fx.filter(tip[0], t), s.fy.filter(tip[1], t)];
  if (s.pointing && pose) {
    s.stroke ??= beginStroke();
    const last = s.stroke.pts.at(-1);
    if (!last || dist(s.tip, last) > 1.5) s.stroke.pts.push(s.tip);
  }

  // 🤏🤏 double pinch → undo
  if (!wasPinched && s.pinched) s.pinchStart = t;
  if (wasPinched && !s.pinched) {
    const dur = t - s.pinchStart;
    if (dur <= TAP_MAX_MS) {
      if (s.pinchStart - s.lastTapEnd <= DOUBLE_GAP_MS) { undo(); s.lastTapEnd = -1e9; }
      else s.lastTapEnd = t;
    } else s.lastTapEnd = -1e9;
  }

  // 👋 flick → clear: fast travel of the hand centre while the hand is open
  const c = lm.reduce((a, p) => [a[0] + p.x / 21, a[1] + p.y / 21], [0, 0]);
  s.trail.push({ t, x: c[0], y: c[1] * f.vh / f.vw, open: openCount >= 3 });
  while (s.trail.length && t - s.trail[0].t > FLICK_WINDOW_MS) s.trail.shift();
  if (t - lastFlickT > FLICK_COOLDOWN_MS && s.trail.length >= 3) {
    const a = s.trail[0], b = s.trail.at(-1);
    const travel = Math.hypot(b.x - a.x, b.y - a.y);
    const openShare = s.trail.filter(p => p.open).length / s.trail.length;
    if (travel > FLICK_DIST && openShare >= 0.5) {
      lastFlickT = t; s.trail.length = 0;
      clearAll();
    }
  }
  return { lm, pose, slot: s };
}

function process(result, t) {
  const f = fit();
  const hands = result.landmarks.map(lm => ({ lm, wrist: px(f, lm[0]) }));
  trackHands(hands);
  return { hands: hands.map((h, i) => analyse(f, h.lm, slots[i], t)) };
}

// ---------------- rendering ----------------
function drawStrokes(f) {
  const w = PEN_SIZE * f.dh / 720;
  ctx.lineCap = ctx.lineJoin = "round";
  ctx.strokeStyle = ctx.fillStyle = PEN_COLOR;
  ctx.shadowColor = PEN_COLOR; ctx.shadowBlur = w * 1.2;
  ctx.lineWidth = w;
  for (const s of strokes) {
    if (!s.pts.length) continue;
    const pts = s.pts.map(p => toScreen(f, p[0], p[1]));
    if (pts.length === 1) { ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], w / 2, 0, 7); ctx.fill(); continue; }
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    ctx.lineTo(pts.at(-1)[0], pts.at(-1)[1]);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
}

function drawHands(f, info) {
  for (const { lm, slot } of info.hands) {
    const P = lm.map(p => toScreen(f, ...px(f, p)));
    ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 2;
    ctx.beginPath();
    for (const c of HandLandmarker.HAND_CONNECTIONS) { ctx.moveTo(...P[c.start]); ctx.lineTo(...P[c.end]); }
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.8)";
    P.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 2.5, 0, 7); ctx.fill(); });

    if (slot.pinched) {                                  // pinch feedback
      const m = [(P[4][0] + P[8][0]) / 2, (P[4][1] + P[8][1]) / 2];
      ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(m[0], m[1], 12, 0, 7); ctx.stroke();
    }
    if (slot.pointing && slot.tip) {                     // pen cursor
      const [x, y] = toScreen(f, ...slot.tip);
      const w = PEN_SIZE * f.dh / 720;
      ctx.fillStyle = PEN_COLOR; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, Math.max(w / 2 + 3, 6), 0, 7); ctx.fill(); ctx.stroke();
    }
  }
}

function loop(t) {
  if (!stream) return;
  if (!video.videoWidth) { requestAnimationFrame(loop); return; }
  const f = fit();

  if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
    lastVideoTime = video.currentTime;
    const t0 = performance.now();
    try {
      const result = landmarker.detectForVideo(video, t0);
      inferMs = performance.now() - t0;
      lastInfo = process(result, t0);
      frames++;
    } catch (e) { showError("Hand tracking error: " + e.message); }
  }

  ctx.save(); ctx.translate(f.ox + f.dw, f.oy); ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, f.dw, f.dh); ctx.restore();

  drawStrokes(f);
  if (lastInfo) drawHands(f, lastInfo);
  if (t - fpsT0 > 1000) { fps = frames * 1000 / (t - fpsT0); frames = 0; fpsT0 = t; }

  requestAnimationFrame(loop);
}

build().catch(e => setStatus("Failed to load model: " + e.message, true));
</script>
</body>
</html>
